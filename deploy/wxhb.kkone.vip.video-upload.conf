location = /api/uploads {
    client_max_body_size 250m;
    include /www/server/nginx/conf/fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /www/server/wxhb-local-media/local-media-upload.php;
    fastcgi_param SCRIPT_NAME /api/uploads;
    fastcgi_param PHP_VALUE "upload_max_filesize=250M\npost_max_size=250M\nmax_file_uploads=20\nmax_execution_time=300";
    fastcgi_pass unix:/tmp/php-cgi-82.sock;
    fastcgi_read_timeout 300s;
}

location ^~ /api/uploads/files/ {
    alias /www/wwwroot/wxhb.kkone.vip-upload-data/;
    default_type application/octet-stream;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=300" always;
    access_log off;
}

location = /api/uploads/cleanup {
    return 404;
}
